<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OtpPilot</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <img class="logo" src="../../icons/otppilot.svg" alt="">
      <div><h1>OtpPilot</h1><p>Private access to your latest code</p></div>
      <a class="settings-icon" href="../options/index.html" target="_blank" aria-label="Open settings" title="Settings">⚙</a>
    </header>

    <section class="account-card" aria-label="Gmail connection">
      <div class="connection-line"><span id="status-dot" class="dot"></span><p id="status" role="status" aria-live="polite">Checking Gmail…</p></div>
      <p id="account" class="account"></p>
      <div class="account-actions">
        <button id="connect" class="secondary" type="button">Connect Gmail</button>
        <button id="disconnect" class="text-button" type="button" hidden>Disconnect</button>
      </div>
    </section>

    <button id="refresh" class="primary" type="button" disabled><span aria-hidden="true">↻</span> Find latest code</button>

    <section id="result" class="result-card" aria-live="polite" hidden>
      <div class="result-heading"><span>YOUR ONE-TIME CODE</span><span class="fresh-pill">FRESH</span></div>
      <p id="code" class="code" aria-label="One-time code"></p>
      <div class="result-actions">
        <button id="reveal" class="secondary" type="button">Reveal</button>
        <button id="copy" class="secondary" type="button">Copy code</button>
      </div>
      <p id="expiry" class="expiry"></p>
    </section>

    <p id="message" class="message" role="status" aria-live="polite" hidden></p>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
